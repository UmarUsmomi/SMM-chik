name: SMM Automator Pipeline

on:
  schedule:
    - cron: '0 */3 * * *'  # Every 3 hours
  workflow_dispatch:        # Manual execution also available

jobs:
  # Keep Render.com free tier awake by pinging health endpoint
  keep-alive:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Ping health endpoint
        run: |
          RENDER_URL="${{ secrets.RENDER_EXTERNAL_URL }}"
          if [ -n "$RENDER_URL" ]; then
            curl -sf "${RENDER_URL}/healthz" || echo "Health ping failed (service may be starting)"
            sleep 15
            curl -sf "${RENDER_URL}/healthz" || echo "Second ping also failed"
          else
            echo "RENDER_EXTERNAL_URL not set, skipping health ping"
          fi

  run-pipeline:
    runs-on: ubuntu-latest
    needs: [keep-alive]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check required secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "has_gemini=false" >> $GITHUB_OUTPUT
            echo "::warning::GEMINI_API_KEY is not set. Pipeline will run in dry-run mode."
          else
            echo "has_gemini=true" >> $GITHUB_OUTPUT
          fi

      - name: Run SMM Pipeline
        env:
          ENVIRONMENT: production
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IMGFLIP_USERNAME: ${{ secrets.IMGFLIP_USERNAME }}
          IMGFLIP_PASSWORD: ${{ secrets.IMGFLIP_PASSWORD }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AUTO_PUBLISH_THRESHOLD: 85
          QUEUE_THRESHOLD: 70
        run: python -m smm_engine.main
        continue-on-error: false
