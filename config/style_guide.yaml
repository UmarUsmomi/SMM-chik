# SMM Automator style guide for Telegram Channel

channel_name: "НейроСофт Гейминг"
language: "ru"

tone:
  primary: "хайповый, энергичный, мемный, но интеллектуальный"
  audience: "разработчики, геймеры, гики, энтузиасты ИИ"

formatting:
  max_length: 500              # Max chars for Telegram caption (strict, must fit under 1024 with title+hashtags)
  use_paragraphs: true
  bold_titles: true
  list_bullets: "🔥"
  hashtag_placement: "bottom"  # top, bottom, none
  max_hashtags: 4

hashtags:
  ai: ["#ии", "#нейросети", "#ai", "#ml"]
  software: ["#разработка", "#программирование", "#софт", "#dev"]
  gaming: ["#гейминг", "#игры", "#gamedev", "#steam"]

rules:
  - "Пиши живо, избегай канцелярита и скучных пересказов."
  - "Добавляй уместный юмор или мемный контекст."
  - "Всегда переводи технический смысл на понятные примеры."
  - "Не используй избитые ИИ-слова: 'подчёркивает', 'следует отметить', 'в этой статье мы рассмотрим'."
  - "Каждый пост должен заканчиваться открытым вопросом или призывом к обсуждению в комментариях."
