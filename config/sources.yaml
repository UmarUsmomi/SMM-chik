# SMM Automator sources configuration

sources:
  hackernews:
    enabled: true
    queries:
      - "artificial intelligence"
      - "neural network"
      - "large language model"
      - "deep learning"
      - "machine learning"
      - "GPU"
    min_score: 50             # Only stories with points >= 50
    limit: 3                  # Number of hits per query (reduced from 20)

  devto:
    enabled: true
    tags:
      - "ai"
      - "gamedev"
      - "webdev"
      - "python"
    limit: 3                  # Number of articles per tag (reduced from 10)
    min_reactions: 10         # Minimum reactions to consider

  steam:
    enabled: true
    apps:
      730: "Counter-Strike 2"
      570: "Dota 2"
      1172470: "Apex Legends"
      2208920: "Assassins Creed Mirage"
      1091500: "Cyberpunk 2077"
    limit: 1                  # News items per game (reduced from 3)

  github:
    enabled: true
    topics:
      - "ai"
      - "llm"
      - "neural-network"
      - "gamedev"
    min_stars: 100
    limit: 2                  # Repos per search query (reduced from 5)

  gamersnexus:
    enabled: true
    rss_url: "https://gamersnexus.net/rss.xml"
    limit: 2                  # Reduced from 5
