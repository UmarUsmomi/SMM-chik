[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smm-automator"
version = "0.1.0"
description = "Autonomous SMM Agent for Tech/AI/Gaming content creation and Telegram publishing"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SMM Automator Team" }
]
dependencies = [
    "google-generativeai>=0.8.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.10",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "pillow>=10.3.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "psycopg2-binary>=2.9.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
    "ignore:.*testclient.*",
]
