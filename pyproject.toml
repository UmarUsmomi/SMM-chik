[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smm-automator"
version = "0.1.0"
description = "Autonomous SMM Agent for Tech/AI/Gaming content creation and Telegram publishing"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SMM Automator Team" }
]
dependencies = [
    "google-generativeai==0.8.6",
    "httpx==0.28.1",
    "feedparser==6.0.12",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.2",
    "pillow==12.3.0",
    "fastapi==0.137.1",
    "uvicorn==0.49.0",
    "psycopg2-binary==2.9.12",
    "jinja2==3.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.0",
    "pytest-asyncio==1.4.0",
    "pip-audit==2.10.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
    "ignore:.*testclient.*",
]
